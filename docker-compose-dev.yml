version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./pois_with_wikidata.csv:/data/pois_with_wikidata.csv:ro
      - ./poi_distances.csv:/data/poi_distances.csv:ro
      - ./.env:/app/.env:ro
    environment:
      - ENVIRONMENT=dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
