version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./pois_with_wikidata.csv:/data/pois_with_wikidata.csv:ro
      - ./poi_distances.csv:/data/poi_distances.csv:ro
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_MODEL_FALLBACKS: ${GEMINI_MODEL_FALLBACKS:-gemini-2.5-flash-lite}
      GRAPHDB_SPARQL_ENDPOINT: ${GRAPHDB_SPARQL_ENDPOINT:-https://eventour-graph.disco.unimib.it/repositories/eventour}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
